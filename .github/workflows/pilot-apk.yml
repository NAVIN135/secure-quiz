name: Build configured pilot APK
on:
  workflow_dispatch:
    inputs:
      supabase_url:
        description: Supabase project HTTPS URL
        required: true
      supabase_public_key:
        description: Publishable or legacy anon key (NEVER service role)
        required: true
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build pilot
        working-directory: apps/student
        env:
          SUPABASE_URL: ${{ inputs.supabase_url }}
          SUPABASE_ANON_KEY: ${{ inputs.supabase_public_key }}
        run: |
          flutter pub get
          flutter build apk --debug --dart-define="SUPABASE_URL=$SUPABASE_URL" --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: securequiz-pilot-apk
          path: apps/student/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
